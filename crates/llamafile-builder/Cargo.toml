[package]
name = "llamafile-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Assemble single-file llamafile executables (CLI + HTTP server + JSON-RPC)"

[[bin]]
name = "llamafile-builder"
path = "src/main.rs"

[dependencies]
llamafile-builder-core = { path = "../llamafile-builder-core" }
llamafile-builder-tui = { path = "../llamafile-builder-tui" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
open = "5"
uuid = { workspace = true }
chrono = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
llamafile-builder-core = { path = "../llamafile-builder-core", features = ["test-utils"] }
tempfile = "3"
temp-env = { version = "0.3", features = ["async_closure"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
