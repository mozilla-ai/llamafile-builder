name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build cross-platform binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies (zig, cargo-zigbuild, rust targets)
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          make setup

      - name: Cross-compile all targets
        run: make dist

      - name: Package archives
        run: |
          set -euo pipefail
          version="${{ github.event.release.tag_name || github.ref_name }}"
          mkdir -p archives staging
          for target_dir in dist/*/; do
            target=$(basename "$target_dir")
            name="llamafile-builder-${version}-${target}"
            stage="staging/${name}"
            mkdir -p "$stage"
            cp "$target_dir"/* "$stage/"
            cp LICENSE README.md "$stage/"
            if [[ "$target" == *windows* ]]; then
              (cd staging && zip -r "../archives/${name}.zip" "$name")
            else
              tar -czf "archives/${name}.tar.gz" -C staging "$name"
            fi
          done
          (cd archives && sha256sum * > SHA256SUMS)
          ls -lh archives

      - name: Upload archives as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: archives/
          if-no-files-found: error

      - name: Attach archives to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" archives/* --clobber
