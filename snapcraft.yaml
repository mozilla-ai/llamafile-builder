name: llamafile-builder
version: git
summary: Build custom llamafiles with bundled models and configurations
description: |
  A desktop application for building custom llamafiles with bundled 
  models and configurations.
  
  Features:
  • Version Selection — Choose from stable, latest, or legacy llamafile versions
  • Model Browser — Search and filter models from Hugging Face
  • Configuration — Set server parameters (host, port, context length, threads)
  • Compute Target — Build CPU-only or GPU-accelerated llamafiles
  • Agent Mode — Create agentfiles with bundled tools and system instructions
  • One-Click Build — Downloads weights, bundles runtime, creates executable

title: llamafile Builder
license: MIT
grade: stable
confinement: strict
base: core24
icon: src-tauri/icons/icon.png

contact: https://github.com/your-org/llamafile-builder/issues
issues: https://github.com/your-org/llamafile-builder/issues
source-code: https://github.com/your-org/llamafile-builder
website: https://github.com/your-org/llamafile-builder

plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404

platforms:
  amd64:
  arm64:
  armhf:

layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
  /usr/lib/aarch64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/aarch64-linux-gnu/webkit2gtk-4.1
  /usr/lib/arm-linux-gnueabihf/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/arm-linux-gnueabihf/webkit2gtk-4.1
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/gpu-2404/X11/XErrorDB

apps:
  llamafile-builder:
    command-chain:
      - bin/gpu-2404-wrapper
    command: bin/llamafile-builder
    desktop: share/applications/llamafile-builder.desktop
    environment:
      GDK_BACKEND: "x11"
      GSK_RENDERER: "cairo"
      GTK_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/gtk-3.0
      GTK_EXE_PREFIX: $SNAP/usr
      GTK_DATA_PREFIX: $SNAP/usr
      GTK_MODULES: ""
      GST_PLUGIN_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/gstreamer-1.0
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - gsettings
      - audio-playback
      - browser-support
      - gpu-2404

parts:
  llamafile-builder:
    plugin: rust
    source: .
    rust-channel: stable
    
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - libjavascriptcoregtk-4.1-dev
      - librsvg2-dev
      - libssl-dev
      - libpango1.0-dev
      - libgdk-pixbuf2.0-dev
      - libsoup-3.0-dev
      - patchelf
      - file
      - pkg-config
    
    stage-packages:
      - libwebkit2gtk-4.1-0
      - webkit2gtk-driver
      - libgtk-3-0
      - libayatana-appindicator3-1
      - libjavascriptcoregtk-4.1-0
      - librsvg2-2
      - libgdk-pixbuf2.0-0
      - libpango-1.0-0
      - libcairo2
      - libsoup-3.0-0
      - libglib2.0-0
      - libgobject-2.0-0
      - libgio-2.0-0
      - dbus-x11
      - libdbus-1-3
      - libcanberra-gtk3-module
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-libav
      - libenchant-2-2
      - libgl1-mesa-dri
      - libgl1
      - libegl1
      - libgbm1
      - libdrm-common
    
    override-build: |
      set -eux
      
      cargo install tauri-cli --version ^2.0.0 --locked
      cargo tauri build --bundles deb
      
      install -Dm755 src-tauri/target/release/llamafile-builder \
        $SNAPCRAFT_PART_INSTALL/bin/llamafile-builder
      
      echo "Converting zipalign APE to native ELF..."
      src-tauri/bin/zipalign --assimilate || true
      install -Dm755 src-tauri/bin/zipalign \
        $SNAPCRAFT_PART_INSTALL/bin/zipalign
      DESKTOP_FILE=$(find src-tauri/target/release/bundle/deb -name "*.desktop" 2>/dev/null | head -n1)
      
      if [ -n "$DESKTOP_FILE" ] && [ -f "$DESKTOP_FILE" ]; then
        install -Dm644 "$DESKTOP_FILE" \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
        
        sed -i 's|Exec=.*|Exec=llamafile-builder|g' \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
        sed -i 's|Icon=.*|Icon=${SNAP}/meta/gui/icon.png|g' \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
        sed -i 's|Categories=.*|Categories=Development;Utility;Science;ArtificialIntelligence;|g' \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
        
        grep -q "GenericName=" $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop || \
          sed -i '/^Name=/a GenericName=AI Model Builder' \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
        grep -q "Keywords=" $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop || \
          sed -i '/^Categories=/a Keywords=llamafile;ai;llm;builder;machine-learning;model;inference;huggingface;' \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
        grep -q "StartupNotify=" $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop || \
          sed -i '/^Terminal=/a StartupNotify=true' \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
        grep -q "SingleMainWindow=" $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop || \
          sed -i '/^Type=/a SingleMainWindow=true\nX-GNOME-SingleWindow=true' \
          $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop
      else
        mkdir -p $SNAPCRAFT_PART_INSTALL/share/applications
        cat > $SNAPCRAFT_PART_INSTALL/share/applications/llamafile-builder.desktop <<EOF
      [Desktop Entry]
      Version=1.5
      Type=Application
      Name=llamafile Builder
      GenericName=AI Model Builder
      Comment=Build custom llamafiles with bundled models and configurations
      Exec=llamafile-builder
      Icon=\${SNAP}/meta/gui/icon.png
      Terminal=false
      Categories=Development;Utility;Science;ArtificialIntelligence;
      Keywords=llamafile;ai;llm;builder;machine-learning;model;inference;huggingface;
      MimeType=application/x-llamafile;
      StartupWMClass=llamafile-builder
      StartupNotify=true
      SingleMainWindow=true
      X-GNOME-SingleWindow=true
      EOF
      fi
      
      mkdir -p $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/{32x32,64x64,128x128,256x256,512x512}/apps
      
      install -Dm644 src-tauri/icons/32x32.png \
        $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/32x32/apps/llamafile-builder.png
      install -Dm644 src-tauri/icons/64x64.png \
        $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/64x64/apps/llamafile-builder.png
      install -Dm644 src-tauri/icons/128x128.png \
        $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/128x128/apps/llamafile-builder.png
      install -Dm644 src-tauri/icons/icon.png \
        $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/256x256/apps/llamafile-builder.png
      install -Dm644 src-tauri/icons/icon.png \
        $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/512x512/apps/llamafile-builder.png

  gpu-2404:
    after: [llamafile-builder]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
      mkdir -p "${CRAFT_PRIME}/gpu-2404"
    prime:
      - bin/gpu-2404-wrapper
