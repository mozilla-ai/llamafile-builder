[project]
name = "version-crawl"
version = "0.1.0"
description = "Crawl GitHub and Hugging Face for a llamafile release and emit a versions.json entry"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.24",
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
version-crawl = "version_crawl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["version_crawl"]
