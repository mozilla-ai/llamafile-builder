[project]
name = "hf-crawl"
version = "0.1.0"
description = "Crawl Hugging Face GGUF repositories and emit llamafile-builder models.json entries"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.24",
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
hf-crawl = "hf_crawl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hf_crawl"]
